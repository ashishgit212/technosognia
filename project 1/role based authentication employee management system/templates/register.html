<!-- templates/register.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register - Legal Contract System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gradient bg-light d-flex align-items-center justify-content-center vh-100 py-4">

<div class="card border-0 shadow-lg p-4 rounded-4" style="width: 440px;">
    <div class="text-center mb-4">
        <div class="bg-success text-white rounded-circle d-inline-flex align-items-center justify-content-center mb-3 shadow-sm" style="width: 60px; height: 60px;">
            <i class="fa-solid fa-user-plus fa-xl"></i>
        </div>
        <h3 class="fw-bold text-dark">Create Account</h3>
        <p class="text-muted small">Register to access the Legal Contract System</p>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="alert alert-{{ category }} py-2 small">{{ message }}</div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form method="POST" action="{{ url_for('register') }}">
        <div class="mb-3">
            <label class="form-label text-secondary small fw-bold">USERNAME</label>
            <div class="input-group">
                <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-user text-muted"></i></span>
                <input type="text" name="username" class="form-control bg-light border-start-0 ps-0" placeholder="Choose a username" required>
            </div>
        </div>
        
        <div class="mb-3">
            <label class="form-label text-secondary small fw-bold">PASSWORD</label>
            <div class="input-group">
                <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-lock text-muted"></i></span>
                <input type="password" name="password" class="form-control bg-light border-start-0 ps-0" placeholder="Create a password" required>
            </div>
        </div>

        <div class="mb-4">
            <label class="form-label text-secondary small fw-bold">SYSTEM ROLE</label>
            <div class="input-group">
                <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-shield-halved text-muted"></i></span>
                <select name="role" class="form-select bg-light border-start-0 ps-0">
                    <option value="user" selected>Employee / Standard User</option>
                    <option value="admin">Administrator</option>
                </select>
            </div>
        </div>

        <button type="submit" class="btn btn-success w-100 py-2 fw-semibold shadow-sm mb-3">Register Account</button>
        
        <div class="text-center">
            <span class="text-muted small">Already have an account?</span>
            <a href="{{ url_for('index') }}" class="text-decoration-none fw-semibold">Sign in here</a>
        </div>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
