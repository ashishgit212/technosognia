<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Contract</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5" style="max-width: 600px;">
    <h2>Edit Contract</h2>
    <form method="POST" class="mt-3 p-4 bg-white shadow-sm rounded">
        <div class="mb-3">
            <label class="form-label">Contract Title</label>
            <input type="text" name="title" class="form-control" value="{{ contract.title }}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Description</label>
            <textarea name="description" class="form-control" rows="4">{{ contract.description }}</textarea>
        </div>
        <div class="mb-3">
            <label class="form-label">Status</label>
            <select name="status" class="form-select">
                <option value="Draft" {% if contract.status == 'Draft' %}selected{% endif %}>Draft</option>
                <option value="Active" {% if contract.status == 'Active' %}selected{% endif %}>Active</option>
                <option value="Expired" {% if contract.status == 'Expired' %}selected{% endif %}>Expired</option>
                <option value="Terminated" {% if contract.status == 'Terminated' %}selected{% endif %}>Terminated</option>
            </select>
        </div>
        <button type="submit" class="btn btn-warning w-100">Update Contract</button>
        <a href="{{ url_for('contracts_list') }}" class="btn btn-secondary w-100 mt-2">Cancel</a>
    </form>
</div>
</body>
</html>
