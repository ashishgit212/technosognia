<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Clause</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5" style="max-width: 600px;">
    <h2>Edit Clause</h2>
    <form method="POST" class="mt-3 p-4 bg-white shadow-sm rounded">
        <div class="mb-3">
            <label class="form-label">Clause Order Number</label>
            <input type="number" name="clause_order" class="form-control" value="{{ clause.clause_order }}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Clause Title</label>
            <input type="text" name="title" class="form-control" value="{{ clause.title }}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Clause Content</label>
            <textarea name="content" class="form-control" rows="5" required>{{ clause.content }}</textarea>
        </div>
        <button type="submit" class="btn btn-warning w-100">Update Clause</button>
        <a href="{{ url_for('contract_detail', id=clause.contract_id) }}" class="btn btn-secondary w-100 mt-2">Cancel</a>
    </form>
</div>
</body>
</html>
