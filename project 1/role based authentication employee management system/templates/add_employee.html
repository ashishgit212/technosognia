<!-- templates/add_employee.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Employee - Employee Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<!-- Top Navigation Bar with Sidebar Trigger and Logout -->
<nav class="navbar navbar-dark bg-dark px-3">
    <div class="container-fluid">
        <button class="btn btn-outline-light" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebarMenu">
            ☰ Sidebar
        </button>
        <span class="navbar-brand mb-0 h1 mx-auto">Employee Management</span>
        <a href="{{ url_for('logout') }}" class="btn btn-danger">Logout</a>
    </div>
</nav>

<!-- Offcanvas Sidebar -->
<div class="offcanvas offcanvas-start" tabindex="-1" id="sidebarMenu">
    <div class="offcanvas-header">
        <h5 class="offcanvas-title">Navigation</h5>
        <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
    </div>
    <div class="offcanvas-body">
        <ul class="list-group list-group-flush">
            <li class="list-group-item"><a href="{{ url_for('dashboard') }}" class="text-decoration-none">Dashboard (List of Employees)</a></li>
            <li class="list-group-item"><a href="{{ url_for('add_user') }}" class="text-decoration-none">Add Employee</a></li>
            <li class="list-group-item"><a href="{{ url_for('reports') }}" class="text-decoration-none">Reports</a></li>
            <li class="list-group-item"><a href="{{ url_for('logout') }}" class="text-decoration-none text-danger">Logout</a></li>
        </ul>
    </div>
</div>

<div class="container mt-5" style="max-width: 500px;">
    <h2>Add Employee</h2>
    <form method="POST" class="mt-3">
        <div class="mb-3">
            <label class="form-label">Full Name</label>
            <input type="text" name="name" class="form-control" placeholder="Enter full name" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Department</label>
            <input type="text" name="department" class="form-control" placeholder="Enter department" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Email Address</label>
            <input type="email" name="email" class="form-control" placeholder="Enter email" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Status</label>
            <select name="status" class="form-select">
                <option value="Active">Active</option>
                <option value="Inactive">Inactive</option>
            </select>
        </div>
        <button type="submit" class="btn btn-success w-100">Save Employee</button>
    </form>
    <a href="{{ url_for('dashboard') }}" class="btn btn-secondary w-100 mt-2">Back to Dashboard</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
