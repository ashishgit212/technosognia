<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Workforce | Account Provisioning</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                        },
                        darksurface: {
                            900: '#090d0a',
                            800: '#111813',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace']
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #090d0a;
            color: #e2e8f0;
        }
        .glass-panel {
            background: rgba(17, 24, 19, 0.75);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(34, 197, 94, 0.15);
        }
    </style>
</head>
<body class="bg-darksurface-900 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-brand-500 selection:text-white">

    <!-- Top Glow Accent -->
    <div class="absolute top-0 left-1/2 -translate-x-1/2 w-[500px] h-[250px] bg-brand-500/10 blur-[120px] rounded-full pointer-events-none"></div>

    <!-- Header Navigation -->
    <header class="w-full border-b border-white/5 py-5 px-6 sm:px-12 flex items-center justify-between z-10">
        <a href="/" class="flex items-center gap-3 group">
            <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-brand-500 to-emerald-700 flex items-center justify-center text-white shadow-lg shadow-brand-500/30">
                <i class="fas fa-cube text-sm"></i>
            </div>
            <span class="font-extrabold tracking-tight text-white">NEXUS<span class="text-brand-500">.</span></span>
        </a>
        <a href="/" class="text-xs font-mono text-slate-400 hover:text-white transition-colors flex items-center gap-2">
            <i class="fas fa-arrow-left"></i> Return Home
        </a>
    </header>

    <!-- Main Registration Box -->
    <main class="max-w-xl w-full mx-auto px-4 py-12 z-10">
        <div class="glass-panel rounded-3xl p-8 sm:p-10 shadow-2xl relative">
            
            <div class="mb-8">
                <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-brand-500/10 border border-brand-500/20 text-brand-400 text-xs font-mono mb-4">
                    <span class="w-1.5 h-1.5 rounded-full bg-brand-500 animate-pulse"></span> Essential Provisioning
                </div>
                <h1 class="text-2xl sm:text-3xl font-extrabold text-white tracking-tight">Create Account</h1>
                <p class="text-sm text-slate-400 mt-1">Enter your essential credentials to set up access.</p>
            </div>

            <form id="registrationForm" class="space-y-5">
                <div>
                    <label class="block text-xs font-mono text-slate-400 mb-1.5">FULL NAME <span class="text-brand-500">*</span></label>
                    <input type="text" name="name" required placeholder="Alex Vance" class="w-full bg-darksurface-800 border border-white/10 rounded-xl px-4 py-3 text-sm text-white placeholder-slate-600 focus:outline-none focus:border-brand-500 transition-colors">
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-mono text-slate-400 mb-1.5">MOBILE NUMBER <span class="text-brand-500">*</span></label>
                        <input type="text" name="mobile" required placeholder="10-digit number" maxlength="10" class="w-full bg-darksurface-800 border border-white/10 rounded-xl px-4 py-3 text-sm text-white placeholder-slate-600 focus:outline-none focus:border-brand-500 transition-colors">
                        <div id="mobileError" class="text-red-400 text-[11px] font-mono mt-1"></div>
                    </div>
                    <div>
                        <label class="block text-xs font-mono text-slate-400 mb-1.5">EMAIL ADDRESS <span class="text-brand-500">*</span></label>
                        <input type="email" name="email" required placeholder="alex@example.com" class="w-full bg-darksurface-800 border border-white/10 rounded-xl px-4 py-3 text-sm text-white placeholder-slate-600 focus:outline-none focus:border-brand-500 transition-colors">
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-mono text-slate-400 mb-1.5">USERNAME <span class="text-brand-500">*</span></label>
                        <input type="text" name="username" required placeholder="username" style="text-transform: lowercase;" class="w-full bg-darksurface-800 border border-white/10 rounded-xl px-4 py-3 text-sm text-white placeholder-slate-600 focus:outline-none focus:border-brand-500 transition-colors">
                        <div id="usernameError" class="text-red-400 text-[11px] font-mono mt-1"></div>
                    </div>
                    <div>
                        <label class="block text-xs font-mono text-slate-400 mb-1.5">PASSWORD <span class="text-brand-500">*</span></label>
                        <input type="password" name="password" required placeholder="••••••••" class="w-full bg-darksurface-800 border border-white/10 rounded-xl px-4 py-3 text-sm text-white placeholder-slate-600 focus:outline-none focus:border-brand-500 transition-colors">
                    </div>
                </div>

                <button type="submit" class="w-full mt-6 py-4 rounded-xl bg-brand-500 hover:bg-brand-400 text-darksurface-900 font-mono font-bold text-sm tracking-wider uppercase transition-all shadow-lg shadow-brand-500/20 flex items-center justify-center gap-2">
                    <i class="fas fa-terminal"></i> Register Account
                </button>
            </form>

            <div class="mt-8 text-center text-xs font-mono text-slate-500">
                <p>Already provisioned? <a href="/employee_login" class="text-brand-400 hover:underline">Access Terminal</a></p>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="w-full text-center py-6 text-[11px] font-mono text-slate-600 border-t border-white/5">
        &copy; 2026 Nexus Enterprise Corporation. All rights reserved.
    </footer>

    <!-- Form Validation Scripts -->
    <script>
        document.querySelector('input[name="mobile"]').addEventListener('input', function() {
            const mobile = this.value;
            const errorDiv = document.getElementById('mobileError');
            if (!/^[0-9]{10}$/.test(mobile) && mobile.length > 0) {
                errorDiv.textContent = 'Required: exactly 10 digits';
            } else {
                errorDiv.textContent = '';
            }
        });

        document.querySelector('input[name="username"]').addEventListener('input', function() {
            const username = this.value;
            const errorDiv = document.getElementById('usernameError');
            if (!/^[a-z]+$/.test(username) && username.length > 0) {
                errorDiv.textContent = 'Required: lowercase letters only';
            } else {
                errorDiv.textContent = '';
            }
        });

        document.getElementById('registrationForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const mobile = document.querySelector('input[name="mobile"]').value;
            if (!/^[0-9]{10}$/.test(mobile)) {
                document.getElementById('mobileError').textContent = 'Required: exactly 10 digits';
                return;
            }
            
            const username = document.querySelector('input[name="username"]').value;
            if (!/^[a-z]+$/.test(username)) {
                document.getElementById('usernameError').textContent = 'Required: lowercase letters only';
                return;
            }
            
            const formData = new FormData(this);
            const btn = document.querySelector('button[type="submit"]');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>Processing...';
            btn.disabled = true;
            
            fetch('/register_employee', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                btn.innerHTML = originalText;
                btn.disabled = false;
                
                if (data.success) {
                    alert('✅ ' + data.message);
                    window.location.href = '/employee_login';
                } else {
                    alert('❌ Error: ' + data.message);
                }
            })
            .catch(error => {
                btn.innerHTML = originalText;
                btn.disabled = false;
                alert('❌ Error: ' + error.message);
            });
        });
    </script>
</body>
</html>
