<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusAuth - Personnel Verification</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --nx-bg: #07090e;
            --nx-surface: #101622;
            --nx-border: #1e293b;
            --nx-accent: #06b6d4;
            --nx-accent-hover: #0891b2;
            --nx-text: #f1f5f9;
            --nx-muted: #64748b;
        }

        body {
            background-color: var(--nx-bg);
            color: var(--nx-text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        .nx-wrapper {
            max-width: 420px;
            margin: 0 auto;
            width: 100%;
            padding: 0 15px;
        }

        .nx-panel {
            background: var(--nx-surface);
            border: 1px solid var(--nx-border);
            border-radius: 12px;
            box-shadow: none;
            overflow: hidden;
        }

        .nx-top-banner {
            background: #0d131f;
            border-bottom: 1px solid var(--nx-border);
            padding: 28px 24px;
            text-align: center;
        }

        .nx-main-content {
            padding: 28px 24px;
        }

        .form-control {
            background: #090d16;
            border: 1px solid var(--nx-border);
            color: #ffffff;
            border-radius: 6px;
            padding: 10px 14px;
            font-size: 14px;
        }

        .form-control:focus {
            background: #090d16;
            border-color: var(--nx-accent);
            color: #ffffff;
            box-shadow: none;
        }

        .nx-input-group-text {
            background: #090d16;
            border: 1px solid var(--nx-border);
            border-right: none;
            color: var(--nx-muted);
            border-top-left-radius: 6px;
            border-bottom-left-radius: 6px;
            padding: 0 14px;
        }

        .nx-input-group .form-control {
            border-top-left-radius: 0;
            border-bottom-left-radius: 0;
        }

        .nx-btn-submit {
            background: var(--nx-accent);
            color: #000000;
            border: none;
            padding: 11px 20px;
            font-weight: 700;
            font-size: 14px;
            border-radius: 6px;
            width: 100%;
            transition: background 0.15s ease;
            letter-spacing: 0.3px;
        }

        .nx-btn-submit:hover {
            background: var(--nx-accent-hover);
            color: #000000;
        }

        .form-label {
            font-size: 12px;
            font-weight: 600;
            color: var(--nx-muted);
            margin-bottom: 6px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .nx-pill-badge {
            background: rgba(6, 182, 212, 0.1);
            color: var(--nx-accent);
            border: 1px solid rgba(6, 182, 212, 0.2);
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            display: inline-block;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    <div class="nx-wrapper">
        <div class="nx-panel">
            <div class="nx-top-banner">
                <div class="mb-3 text-cyan" style="color: var(--nx-accent); font-size: 28px;">
                    <i class="fas fa-fingerprint"></i>
                </div>
                <h4 class="fw-bold text-white mb-2" style="font-size: 1.25rem;">Credential Gateway</h4>
                <div><span class="nx-pill-badge"><i class="fas fa-shield-alt me-1"></i>Restricted Access</span></div>
            </div>
            <div class="nx-main-content">
                <form id="nexusAuthForm">
                    <div class="mb-3">
                        <label class="form-label">System Handle</label>
                        <div class="input-group nx-input-group">
                            <span class="input-group-text nx-input-group-text"><i class="fas fa-user"></i></span>
                            <input type="text" class="form-control" name="username" placeholder="Enter operator alias" required>
                        </div>
                    </div>
                    <div class="mb-4">
                        <label class="form-label">Secret Cipher</label>
                        <div class="input-group nx-input-group">
                            <span class="input-group-text nx-input-group-text"><i class="fas fa-lock"></i></span>
                            <input type="password" class="form-control" name="password" placeholder="Enter access key" required>
                        </div>
                    </div>
                    <input type="hidden" name="role" value="hr">
                    <button type="submit" class="nx-btn-submit">
                        <i class="fas fa-terminal me-2"></i>Authenticate Session
                    </button>
                </form>
                <div class="text-center mt-4 pt-3 border-top border-secondary border-opacity-10">
                    <p class="mb-2"><small class="text-muted font-monospace" style="font-size: 11px;">Default Operator: hr / hr123</small></p>
                    <p class="mb-0"><a href="/" class="text-decoration-none small" style="color: var(--nx-accent);"><i class="fas fa-arrow-left me-1"></i>Return to Portal Root</a></p>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('nexusAuthForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const payloadData = new FormData(this);
            
            fetch('/login_employee', {
                method: 'POST',
                body: payloadData
            })
            .then(res => res.json())
            .then(resObj => {
                if (resObj.success) {
                    window.location.href = resObj.redirect;
                } else {
                    alert('Authentication Denied: ' + resObj.message);
                }
            })
            .catch(err => {
                alert('Connection Fault: ' + err.message);
            });
        });
    </script>

    <!-- Bootstrap Script Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
