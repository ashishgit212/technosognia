<!-- templates/register.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register - Employee Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">

<div class="card shadow p-4" style="width: 400px;">
    <h3 class="text-center mb-3">Register</h3>
    
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="alert alert-{{ category }}">{{ message }}</div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form method="POST" action="{{ url_for('register') }}">
        <div class="mb-3">
            <label class="form-label">Full Name</label>
            <input type="text" name="name" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Department</label>
            <input type="text" name="department" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Email Address</label>
            <input type="email" name="email" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" name="password" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Status</label>
            <select name="status" class="form-select">
                <option value="Active">Active</option>
                <option value="Inactive">Inactive</option>
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">Role</label>
            <select name="role" id="roleSelect" class="form-select" onchange="toggleAdminSecret()">
                <option value="Employee">Employee</option>
                <option value="Admin">Admin</option>
            </select>
        </div>
        
        <!-- Admin Secret Key Field (Hidden by default) -->
        <div class="mb-3 d-none" id="adminSecretField">
            <label class="form-label">Admin Secret Key</label>
            <input type="password" name="admin_secret" class="form-control" placeholder="Enter secret key">
        </div>

        <button type="submit" class="btn btn-success w-100">Register</button>
    </form>
    
    <div class="mt-3 text-center">
        <a href="{{ url_for('login') }}" class="text-decoration-none">Already have an account? Login</a>
    </div>
</div>

<script>
function toggleAdminSecret() {
    var roleSelect = document.getElementById('roleSelect');
    var adminSecretField = document.getElementById('adminSecretField');
    if (roleSelect.value === 'Admin') {
        adminSecretField.classList.remove('d-none');
    } else {
        adminSecretField.classList.add('d-none');
    }
}
</script>

</body>
</html>
