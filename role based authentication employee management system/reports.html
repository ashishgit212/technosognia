<!-- templates/reports.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>System Reports - Employee Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <h2>Simple Employee Report</h2>
    <hr>
    
    <div class="row mt-4">
        <div class="col-md-6">
            <div class="card bg-success text-white mb-3">
                <div class="card-body">
                    <h4>Active Employees</h4>
                    <h2>{{ report_data.active_employees }}</h2>
                </div>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card bg-secondary text-white mb-3">
                <div class="card-body">
                    <h4>Inactive Employees</h4>
                    <h2>{{ report_data.inactive_employees }}</h2>
                </div>
            </div>
        </div>
    </div>

    <a href="{{ url_for('dashboard') }}" class="btn btn-dark mt-3">Back to Dashboard</a>
</div>

</body>
</html>
