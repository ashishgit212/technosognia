<!DOCTYPE html>
<html lang="en">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .sidebar { height: 100vh; background: #2c3e50; color: white; padding: 20px; }
        .sidebar a { color: #bdc3c7; display: block; padding: 10px; text-decoration: none; }
        .sidebar a:hover { color: white; background: #34495e; }
    </style>
</head>
<body>
<div class="container-fluid">
    <div class="row">
        <!-- Sidebar Navigation -->
        <nav class="col-md-2 sidebar">
            <h4>Employee Management System</h4>
            <a href="/dashboard">Dashboard</a>
            <a href="/add">Add Employee</a>
            <a href="/search">Search Employee</a>
            <a href="/reports">Reports</a>
        </nav>
        
        <!-- Main Content -->
        <main class="col-md-10 mt-4">
            <h2>Dashboard</h2>
            <div class="card bg-primary text-white p-3 mb-4" style="width: 200px;">
                <h5>Total Records: {{ total }}</h5>
            </div>
            <table class="table table-striped">
                <thead>
                    <tr><th>ID</th><th>Name</th><th>Age</th><th>Dept</th><th>Email</th></tr>
                </thead>
                <tbody>
                    {% for emp in employees %}
                    <tr>
                        <td>{{ emp.id }}</td>
                        <td>{{ emp.name }}</td>
                        <td>{{ emp.age }}</td>
                        <td>{{ emp.department }}</td>
                        <td>{{ emp.email }}</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </main>
    </div>
</div>
</body>
</html>
